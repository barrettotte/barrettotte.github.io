{{ define "main" }}
  <div id="archive">
    <h1 class="page-title">Now</h1>
    <p class="page-desc">
      What I'm currently up to. Last updated {{ .Site.Data.now.updated }}.
    </p>

    {{ range .Site.Data.now.sections }}
      <div class="now-section">
        <h2 class="section-header">
          <i class="{{ .icon }} fa-fw"></i> {{ .title }}
        </h2>
        <ul class="data-list">
          {{ range .items }}
            <li>{{ . }}</li>
          {{ end }}
        </ul>
      </div>
    {{ end }}
  </div>
{{ end }}
