<footer id="footer">
  <div class="footer-left">
    &copy; 2018-{{ now.Format "2006" }} 
    <a href="/">{{ print .Site.Params.author | markdownify }}</a>
  </div>
  <div class="footer-right">
    <nav>
      <ul>
        <li>
          <a class="icon" target="_blank" rel="noopener" href="mailto:{{ .Site.Params.links.email }}" aria-label="Email">
            <i class="fas fa-lg fa-envelope" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="icon" target="_blank" rel="noopener" href="{{ .Site.Params.links.github }}" aria-label="GitHub">
            <i class="fab fa-lg fa-github" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="icon" target="_blank" rel="noopener" href="{{ .Site.Params.links.linkedin }}" aria-label="LinkedIn">
            <i class="fab fa-lg fa-linkedin" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="icon" target="_blank" rel="noopener" href="{{ .Site.Params.links.kaggle }}" aria-label="Kaggle">
            <i class="fab fa-lg fa-kaggle" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a class="icon" target="_blank" rel="noopener" href="{{ .Site.Params.links.itchio }}" aria-label="Itch.io">
            <i class="fab fa-lg fa-itch-io" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</footer>
