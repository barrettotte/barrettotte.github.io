{{ define "main"}}
  <div>
    <header class="page-header">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ with .Content }}<div class="page-desc">{{ . }}</div>{{ end }}
    </header>
    <ul>
      {{ range .Pages }}
        <li>
          <a href="{{ .RelPermalink }}">
            {{ if .Date }} {{ .Date.Format "2006-01-02" }} | {{ end }} {{ .Title }}
          </a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
