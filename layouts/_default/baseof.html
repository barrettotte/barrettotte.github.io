<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
  {{- partial "head" . -}}

  <body class="max-width mx-auto px3 ltr">
    <a href="#main" class="skip-link">Skip to main content</a>
    <div class="content index pt2 pb4">
      {{- partial "header" . -}}
      <main id="main">
        {{- block "main" . }}{{- end }}
      </main>
      {{- partial "footer" . -}}
    </div>

    <script src="{{ "js/custom.js" | relURL }}" defer></script>
    {{- if .IsHome }}
      <script src="{{ "js/carousel.js" | relURL }}" defer></script>
    {{- end }}
    {{- if or (eq .Section "projects") (eq .Section "bytes") (eq .Title "My Library") }}
      <script src="{{ "js/filter.js" | relURL }}" defer></script>
    {{- end }}
  </body>
</html>
